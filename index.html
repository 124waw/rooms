<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>ROOMS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050505; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: #ddd; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: min(92vmin, 520px); height: min(92vmin, 520px); overflow: hidden; background: #000; flex: none; box-shadow: 0 0 0 1px #222, 0 12px 40px #000a; }
  canvas#c { display: block; position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #menu, #death, #win, #lobby, #a90, #js { position: absolute; inset: 0; pointer-events: none; }
  #menu, #death, #win, #lobby { pointer-events: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
  #menu, #lobby { background: linear-gradient(180deg, #0008 0%, #0002 45%, #0009 100%); }
  #death, #win { background: #0a0a0cee; }
  #menu h1, #lobby h1 { font-size: 42px; letter-spacing: 10px; color: #eee; font-weight: 200; text-shadow: 0 2px 18px #000, 0 0 40px #fff2; }
  #menu p, #death p, #win p, #lobby p { color: #c8c8c8; margin: 10px 0 18px; font-size: 11px; letter-spacing: 1px; text-align: center; padding: 0 16px; line-height: 1.5; text-shadow: 0 1px 8px #000; }
  .btn { pointer-events: auto; background: #1a1a1ecc; border: 1px solid #666; color: #eee; padding: 10px 18px; margin: 5px; font-size: 13px; letter-spacing: 2px; cursor: pointer; min-width: 160px; }
  #netPanel { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 6px; pointer-events: auto; }
  #lobby { display: none; }
  #netPanel input, #lobby input { background: #0b0b0bcc; border: 1px solid #555; color: #eee; padding: 8px 10px; width: 160px; text-align: center; letter-spacing: 2px; font-size: 13px; user-select: text; -webkit-user-select: text; }
  #netRow { display: flex; gap: 6px; align-items: center; }
  #netRow input { width: 88px; letter-spacing: 3px; text-transform: uppercase; }
  #netRow .btn { min-width: 66px; margin: 0; padding: 8px 10px; }
  #netErr { color: #f66; font-size: 11px; min-height: 14px; letter-spacing: 1px; }
  #lobbyCode { font-size: 22px; letter-spacing: 8px; color: #eee; font-weight: 200; }
  #lobbyList { font-size: 12px; color: #bbb; text-align: center; line-height: 1.7; min-height: 48px; white-space: pre-line; }
  #netLine { font-size: 10px; color: #888; letter-spacing: 1px; }
  #stage.title #hud, #stage.title #joyWrap, #stage.title #btns, #stage.title #pcHint, #stage.title #cross, #stage.title #holdBar, #stage.title #holdLabel, #stage.title #inv, #stage.title #hint, #stage.title #warn, #stage.title #slats { display: none; }
  #slats { position: absolute; inset: 0; pointer-events: none; z-index: 4; display: none; background: repeating-linear-gradient(90deg, #050505f2 0 9px, #0000 9px 20px); box-shadow: inset 0 0 90px 48px #000; }
  #stage.in-locker #slats { display: block; }
  #stage.in-table #vignette { box-shadow: inset 0 80px 70px 20px #000d, inset 0 -40px 50px 16px #000a; }
  .btn:active { background: #333; }
  #hud { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 1px; text-shadow: 0 1px 4px #000; z-index: 5; pointer-events: none; }
  #doorLabel { font-size: 16px; font-weight: 600; color: #f2f2f2; }
  #hint { position: absolute; bottom: 30%; left: 0; right: 0; text-align: center; color: #fff; font-size: 12px; text-shadow: 0 0 8px #000; opacity: 0; transition: opacity .2s; z-index: 6; pointer-events: none; }
  #warn { position: absolute; top: 18%; left: 0; right: 0; text-align: center; color: #f44; font-size: 13px; letter-spacing: 3px; opacity: 0; z-index: 7; pointer-events: none; text-shadow: 0 0 12px #f00; }
  #cross { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border: 1px solid #fff8; border-radius: 50%; pointer-events: none; z-index: 4; }
  #joyWrap { position: absolute; left: 10px; bottom: 10px; width: 96px; height: 96px; z-index: 8; pointer-events: auto; touch-action: none; }
  #joyBase { width: 96px; height: 96px; border-radius: 50%; background: #fff1; border: 1px solid #fff3; position: relative; }
  #joyKnob { width: 40px; height: 40px; border-radius: 50%; background: #fff4; border: 1px solid #fff6; position: absolute; left: 28px; top: 28px; }
  #btns { position: absolute; right: 8px; bottom: 10px; z-index: 8; pointer-events: auto; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .abtn { width: 52px; height: 52px; border-radius: 50%; background: #111c; border: 1px solid #fff4; color: #eee; font-size: 10px; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; text-align: center; }
  .abtn.on { background: #ffc10733; border-color: #ffc107aa; }
  .abtn:active { background: #fff3; }
  #inv { position: absolute; left: 50%; transform: translateX(-50%); bottom: 8px; display: flex; gap: 8px; z-index: 6; pointer-events: none; font-size: 11px; color: #ccc; }
  .chip { background: #0008; border: 1px solid #fff2; padding: 4px 8px; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 15; }
  #vignette { position: absolute; inset: 0; pointer-events: none; z-index: 3; box-shadow: inset 0 0 80px 24px #000a; }
  #static { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; opacity: 0; mix-blend-mode: screen; image-rendering: pixelated; }
  #a90 { z-index: 16; display: none; background: #000; }
  #a90 canvas, #js canvas { width: 100%; height: 100%; }
  #js { z-index: 17; display: none; background: #000; }
  #holdBar { position: absolute; left: 50%; top: 58%; width: 84px; height: 6px; margin-left: -42px; background: #fff2; border: 1px solid #fff5; opacity: 0; z-index: 9; pointer-events: none; }
  #holdFill { height: 100%; width: 0; background: #eee; }
  #holdLabel { position: absolute; left: 0; right: 0; top: 54%; text-align: center; font-size: 11px; letter-spacing: 2px; color: #ccc; opacity: 0; z-index: 9; pointer-events: none; }
  #pcHint { position: absolute; bottom: 6px; left: 112px; right: 70px; font-size: 9px; color: #555; z-index: 5; pointer-events: none; line-height: 1.3; }
  @media (pointer: fine) {
    #joyWrap { opacity: .35; }
  }
</style>
</head>
<body>
<div id="stage">
<canvas id="c"></canvas>
<canvas id="static"></canvas>
<div id="vignette"></div>
<div id="slats"></div>
<div id="cross"></div>
<div id="hud">
  <div>
    <div id="doorLabel">A-000</div>
    <div id="statLine">手电 100% · 电池 0 · 绷带 0</div>
  </div>
    <div>
      <div id="rightHud">检查点 A-000</div>
      <div id="netLine"></div>
    </div>
</div>
<div id="hint"></div>
<div id="warn"></div>
<div id="holdLabel">开门</div>
<div id="holdBar"><div id="holdFill"></div></div>
<div id="inv"></div>
<div id="flash"></div>
<div id="joyWrap"><div id="joyBase"><div id="joyKnob"></div></div></div>
<div id="btns">
  <div class="abtn" id="btnBat">换电</div>
  <div class="abtn" id="btnLight">手电</div>
  <div class="abtn" id="btnSprint">冲刺</div>
  <div class="abtn" id="btnUse">互动</div>
</div>
<div id="pcHint">WASD 移动 · 鼠标视角 · 靠近自动开门 · F 手电 · R 换电/手摇 · G 切换光源 · Shift 冲刺</div>
<div id="a90"><canvas id="a90c"></canvas></div>
<div id="js"><canvas id="jsc"></canvas></div>
<div id="menu">
  <h1>ROOMS</h1>
  <p>1000 扇门 · A-60 / A-90 / A-120 · 每 100 门可存档<br/>检查点 20 电池可兑换手摇手电 · 走过 10 门后红墙抹去身后</p>
  <button class="btn" id="btnNew">单人开始</button>
  <button class="btn" id="btnCont" style="display:none">继续存档</button>
  <div id="netPanel">
    <input id="netName" maxlength="10" placeholder="名字" autocomplete="off" />
    <button class="btn" id="btnHost">创建房间</button>
    <div id="netRow">
      <input id="netCode" maxlength="5" placeholder="房间码" autocomplete="off" />
      <button class="btn" id="btnJoin">加入</button>
    </div>
    <div id="netErr"></div>
  </div>
</div>
<div id="lobby">
  <h1 style="font-weight:200;letter-spacing:10px;font-size:28px">房间</h1>
  <div id="lobbyCode">----</div>
  <p>最多 4 人 · 同一张地图 · 房主同步怪物</p>
  <div id="lobbyList"></div>
  <button class="btn" id="btnNetStart" style="display:none">开始联机</button>
  <button class="btn" id="btnNetLeave">离开房间</button>
  <div id="netWait" style="font-size:11px;color:#888;letter-spacing:1px">等待房主开始</div>
</div>
<div id="death" style="display:none">
  <h1 style="font-weight:200;letter-spacing:10px;font-size:42px">你死了</h1>
  <p id="deathMsg"></p>
  <button class="btn" id="btnRetry">从检查点重生</button>
  <button class="btn" id="btnMenu">返回标题</button>
</div>
<div id="win" style="display:none">
  <h1 style="font-weight:200;letter-spacing:10px;font-size:42px">A-1000</h1>
  <p>你走到了尽头。好奇的光在此等待。<br/>胶选手电永远亮着。</p>
  <button class="btn" id="btnWin">返回标题</button>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
<script>
(function () {
  const SAVE_KEY = "rooms_html_v1";
  const MAX = 1000;
  const RL = 16, RW = 12, RH = 4.2;
  const canvas = document.getElementById("c");
  const stage = document.getElementById("stage");
  function viewSize() {
    const r = stage.getBoundingClientRect();
    const s = Math.max(64, Math.round(Math.min(r.width, r.height)));
    return s;
  }

  const $ = (id) => document.getElementById(id);
  const menu = $("menu"), death = $("death"), win = $("win");
  const a90el = $("a90"), jsel = $("js");
  const hintEl = $("hint"), warnEl = $("warn"), flashEl = $("flash");
  const staticEl = $("static");
  let staticAmt = 0;

  let renderer, scene, camera, clock;
  let player, keys = {}, joy = { x: 0, y: 0 }, sprintBtn = false;
  let look = { yaw: 0, pitch: 0 };
  let pointerLocked = false;
  let running = false, lastT = 0;
  let rooms = new Map();
  let generated = new Set();
  let solids = [];
  let interactives = [];
  let redWall = null, redWallZ = -999;
  let entities = [];
  let items3d = [];
  let flashlight, gummyLight, crankLight, ambient, flickerLights = [];
  let holdShake = false;
  let shakeTick = 0;
  let hiding = false, hideObj = null, hideTime = 0, hideFrom = null;
  let crouch = false;
  let a90Active = false, a90Timer = 0, a90Cooldown = 12, a90Warn = 0, a90Warn0 = 0;
  let footsteps = 0;
  let audioCtx = null;
  let rumbleNodes = null;
  let creakNode = null;
  let humNode = null;
  let holdUse = false;
  let holdOnce = false;
  let seedBase = (Math.random() * 1e9) | 0;
  let net = {
    ws: null, id: "", host: false,     code: "", connected: false, started: false,
    name: "", peers: new Map(), lastSend: 0, lastEnt: 0, pending: null, lobbyIds: []
  };
  const peerPalette = [0x6aa8d8, 0xd88a6a, 0x7bc47b, 0xd4b85a];

  const st = {
    door: 0, hp: 100, battery: 80, batteries: 2, bandages: 0,
    hasFlash: true, hasGummy: false, hasLighter: false, hasCrank: false,
    lightOn: true, useGummy: false, useLighter: false, useCrank: false, crankCharge: 0,
    checkpoint: 0, dead: false, won: false, stamina: 100
  };

  function rng(n) {
    let t = (seedBase + n * 1103515245 + 12345) | 0;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function ri(n, a, b) { return a + Math.floor(rng(n) * (b - a + 1)); }
  function doorName(d) { return "A-" + String(d).padStart(3, "0"); }
  function checkDoor(d) {
    d = d | 0;
    if (d < 0) d = 0;
    if (d > MAX) d = MAX;
    return Math.floor(d / 100) * 100;
  }
  function zOf(d) { return d * RL; }

  function showHint(t, ms) {
    hintEl.textContent = t;
    hintEl.style.opacity = "1";
    clearTimeout(showHint._t);
    showHint._t = setTimeout(() => hintEl.style.opacity = "0", ms || 1600);
  }
  function showWarn(t, ms) {
    warnEl.textContent = t;
    warnEl.style.opacity = "1";
    clearTimeout(showWarn._t);
    showWarn._t = setTimeout(() => warnEl.style.opacity = "0", ms || 1200);
  }
  function flash(a, c, ms) {
    flashEl.style.background = c || "#fff";
    flashEl.style.opacity = String(a);
    setTimeout(() => { flashEl.style.transition = "opacity .35s"; flashEl.style.opacity = "0"; }, ms || 40);
    setTimeout(() => { flashEl.style.transition = ""; }, 400);
  }
  function warnDur() { return st.door < 150 ? 6 : 4; }
  function threatStatic(e) {
    if (e.wind > 0) {
      const p = 1 - e.wind / (e.wind0 || warnDur());
      return 0.28 + p * 0.62;
    }
    const dist = Math.hypot(e.mesh.position.x - player.x, e.z - player.z);
    const reach = e.kind === "a60" ? 26 : 22;
    const t = 1 - Math.min(1, Math.max(0, dist / reach));
    return t * t * (e.kind === "a60" ? 1 : 0.72);
  }
  function updateStaticTarget() {
    let t = 0;
    for (const e of entities) {
      if (e.kind === "a60" || e.kind === "a120") t = Math.max(t, threatStatic(e));
    }
    if (a90Warn > 0) t = Math.max(t, 0.35 + (1 - a90Warn / (a90Warn0 || warnDur())) * 0.5);
    if (hiding) t *= 0.42;
    staticAmt += (t - staticAmt) * (t > staticAmt ? 0.18 : 0.08);
    if (staticAmt < 0.012) staticAmt = t < 0.01 ? 0 : staticAmt;
  }
  function drawStatic() {
    const a = staticAmt;
    if (a < 0.01) {
      staticEl.style.opacity = "0";
      if (camera) camera.rotation.z = 0;
      return;
    }
    const s = Math.max(64, Math.min(180, (viewSize() * 0.28) | 0));
    if (staticEl.width !== s) { staticEl.width = s; staticEl.height = s; }
    const g = staticEl.getContext("2d");
    const img = g.createImageData(s, s);
    const d = img.data;
    const grain = 70 + a * 185;
    const bands = 2 + (a * 7 | 0);
    for (let y = 0; y < s; y++) {
      const tear = ((Math.random() * bands * a) | 0) * (Math.random() < a * 0.55 ? 1 : 0);
      for (let x = 0; x < s; x++) {
        const i = (y * s + x) * 4;
        const n = Math.random() * grain;
        const scan = (y + tear + ((performance.now() * 0.08) | 0)) % 7 === 0 ? 40 * a : 0;
        d[i] = n + scan;
        d[i + 1] = n * 0.92;
        d[i + 2] = n * 0.88 + a * 18;
        d[i + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);
    staticEl.style.opacity = String(Math.min(0.72, 0.08 + a * 0.64));
    if (camera) camera.rotation.z = (Math.random() - 0.5) * a * 0.045;
  }
  function clearStatic() {
    staticAmt = 0;
    staticEl.style.opacity = "0";
    if (camera) camera.rotation.z = 0;
  }

  function ensureAudio() {
    if (audioCtx) {
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    startHum();
    return audioCtx;
  }
  function noiseBuf(sec) {
    const ctx = ensureAudio();
    const buf = ctx.createBuffer(1, Math.max(1, ctx.sampleRate * sec | 0), ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }
  function beep(freq, dur, type, vol, slide) {
    const ctx = ensureAudio();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || "sawtooth";
    o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), ctx.currentTime + dur);
    g.gain.value = vol || 0.08;
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + dur);
  }
  function noiseBurst(dur, vol, hp, type) {
    const ctx = ensureAudio();
    const n = ctx.createBufferSource();
    n.buffer = noiseBuf(dur);
    const f = ctx.createBiquadFilter();
    f.type = type || "bandpass"; f.frequency.value = hp || 800; f.Q.value = 0.7;
    const g = ctx.createGain();
    g.gain.value = vol || 0.15;
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    n.connect(f); f.connect(g); g.connect(ctx.destination);
    n.start();
  }
  function sfxDoorCreak() {
    const ctx = ensureAudio();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(140, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(70, ctx.currentTime + 0.55);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.07, ctx.currentTime + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.7);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.72);
    noiseBurst(0.35, 0.05, 480);
  }
  function sfxDoorLatch() {
    noiseBurst(0.08, 0.1, 220, "lowpass");
    beep(90, 0.08, "square", 0.04);
  }
  function sfxLocker(inLock) {
    noiseBurst(0.12, 0.12, inLock ? 180 : 320, "lowpass");
    beep(inLock ? 110 : 160, 0.09, "square", 0.05);
  }
  function sfxFlash(on) {
    noiseBurst(0.04, 0.06, on ? 1800 : 700);
    beep(on ? 980 : 240, 0.04, "square", 0.03);
  }
  function sfxFoot() {
    noiseBurst(0.05, 0.045, 90, "lowpass");
  }
  function sfxA90() {
    noiseBurst(0.2, 0.28, 2600);
    beep(1680, 0.16, "square", 0.12, 420);
  }
  function sfxA120Drum() {
    const ctx = ensureAudio();
    for (let i = 0; i < 3; i++) {
      const t = ctx.currentTime + i * 0.42;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(62, t);
      o.frequency.exponentialRampToValueAtTime(28, t + 0.28);
      g.gain.setValueAtTime(0.16, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.32);
    }
  }
  function sfxKill(kind) {
    if (kind === "a90") { noiseBurst(0.7, 0.32, 2800); beep(2200, 0.4, "square", 0.16, 90); return; }
    if (kind === "a120") { noiseBurst(0.8, 0.28, 900); beep(80, 0.5, "sawtooth", 0.14, 40); return; }
    noiseBurst(0.9, 0.34, 350, "lowpass");
    beep(55, 0.7, "sawtooth", 0.18, 28);
  }
  function startHum() {
    if (humNode) return;
    const ctx = ensureAudio();
    const n = ctx.createBufferSource();
    n.buffer = noiseBuf(2); n.loop = true;
    const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 140;
    const g = ctx.createGain(); g.gain.value = 0.018;
    const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = 58;
    const g2 = ctx.createGain(); g2.gain.value = 0.012;
    n.connect(f); f.connect(g); g.connect(ctx.destination);
    o.connect(g2); g2.connect(ctx.destination);
    n.start(); o.start();
    humNode = { n, o, g, f };
  }
  function updateHum() {
    if (!humNode) return;
    humNode.g.gain.value = st.door >= 30 ? 0.01 : 0.022;
    humNode.f.frequency.value = st.door >= 30 ? 90 : 160;
  }
  function startRumble() {
    stopRumble();
    const ctx = ensureAudio();
    const n = ctx.createBufferSource();
    n.buffer = noiseBuf(4); n.loop = true;
    const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 90;
    const g = ctx.createGain(); g.gain.value = 0.05;
    const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = 22;
    const g2 = ctx.createGain(); g2.gain.value = 0.06;
    const hiss = ctx.createBufferSource();
    hiss.buffer = noiseBuf(3); hiss.loop = true;
    const hf = ctx.createBiquadFilter(); hf.type = "bandpass"; hf.frequency.value = 2400; hf.Q.value = 0.4;
    const hg = ctx.createGain(); hg.gain.value = 0.035;
    n.connect(f); f.connect(g); g.connect(ctx.destination);
    o.connect(g2); g2.connect(ctx.destination);
    hiss.connect(hf); hf.connect(hg); hg.connect(ctx.destination);
    n.start(); o.start(); hiss.start();
    rumbleNodes = { o, n, g, g2, hiss, hg };
  }
  function stopRumble() {
    if (!rumbleNodes) return;

  function spawnItem(kind, x, y, z) {
    let color = 0x222; let sy = 0.18;

    if (kind === "bandage") { color = 0xc05050; sy = 0.08; }
    if (kind === "flashlight") { color = 0x8899aa; sy = 0.1; }
    if (kind === "lighter") { color = 0xb07020; sy = 0.14; }
    if (kind === "gummy") { color = 0x88ff44; sy = 0.12; }
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.28, sy, 0.12), new THREE.MeshLambertMaterial({ color }));
    m.position.set(x, y, z);
    scene.add(m);
    items3d.push({ kind, mesh: m, x, y, z, taken: false });
  }

  function unloadRoom(d) {
    const g = rooms.get(d);
    if (!g) return;
    scene.remove(g);
    g.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
    });
    rooms.delete(d);
    solids = solids.filter((s) => {
      let p = s.mesh;
      while (p) { if (p === g) return false; p = p.parent; }
      return true;
    });
    interactives = interactives.filter((it) => {
      let p = it.mesh;
      while (p) { if (p === g) return false; p = p.parent; }
      return true;
    });
    flickerLights = flickerLights.filter((l) => {
      let p = l; while (p) { if (p === g) return false; p = p.parent; } return true;
    });
  }

  function ensureRooms() {
    let lo = st.door, hi = st.door;
    for (const p of net.peers.values()) {
      const d = Math.max(0, Math.min(MAX, (p.z / RL) | 0));
      if (d < lo) lo = d;
      if (d > hi) hi = d;
    }
    const from = Math.max(0, lo - 6);
    const to = Math.min(MAX, hi + 5);
    for (let d = from; d <= to; d++) buildRoom(d);
    for (const d of [...rooms.keys()]) {
      if (d < from || d > to) unloadRoom(d);
    }
    items3d = items3d.filter((it) => {
      if (it.taken) { scene.remove(it.mesh); return false; }
      const rd = Math.floor(it.z / RL);
      if (rd < from || rd > to) { scene.remove(it.mesh); return false; }
      return true;
    });
  }

  function placeRedWall() {
    if (redWall) { scene.remove(redWall); redWall = null; }
    if (st.door < 10) { redWallZ = -999; return; }
    const cut = st.door - 5;
    redWallZ = zOf(cut);
    redWall = new THREE.Mesh(new THREE.BoxGeometry(RW + 1, RH + 1, 0.4), matRed);
    redWall.position.set(0, RH / 2, redWallZ);
    scene.add(redWall);
    const glow = new THREE.PointLight(0xff1111, 1.4, 18);
    glow.position.set(0, 2, redWallZ + 0.5);
    redWall.add(glow);
  }

  function resizeView() {
    const s = viewSize();
    if (!renderer) return;
    renderer.setSize(s, s, false);
    camera.aspect = 1;
    camera.updateProjectionMatrix();
  }

    camera.add(flashlight.target);
    gummyLight = new THREE.SpotLight(0xb6ff66, 1.8, 16, Math.PI / 6.5, 0.5, 1);
    gummyLight.position.set(0, 0, 0);
    camera.add(gummyLight);
    gummyLight.target.position.set(0, 0, -1);
    camera.add(gummyLight.target);
    gummyLight.visible = false;
    crankLight = new THREE.SpotLight(0xffe8a8, 2.1, 18, Math.PI / 6.8, 0.4, 1.05);
    crankLight.position.set(0, 0, 0);
    camera.add(crankLight);
    crankLight.target.position.set(0, 0, -1);
    camera.add(crankLight.target);
    crankLight.visible = false;
    scene.add(camera);
    makeMats();
    player = { x: 0, y: 1.6, z: 2, vx: 0, vz: 0 };
    camera.position.set(player.x, player.y, player.z);
  }

  function collides(x, z, rad) {
    const y = (hiding && hideObj && hideObj.kind === "table") || crouch ? 0.32 : 1.0;
    for (const s of solids) {
      const top = s.y + s.h / 2;
      const bot = s.y - s.h / 2;
      if (y + 0.28 < bot) continue;
      if (y - 0.12 > top) continue;
      const hx = s.w / 2 + rad, hz = s.d / 2 + rad;
      if (Math.abs(x - s.x) < hx && Math.abs(z - s.z) < hz) return true;
    }
    return false;
  }

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function startCreak() {
    if (creakNode) return;
    const ctx = ensureAudio();
    const o = ctx.createOscillator();
    const n = ctx.createBufferSource();
    const buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    n.buffer = buf; n.loop = true;
    const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 420; f.Q.value = 3;
    const g = ctx.createGain(); g.gain.value = 0.03;
    o.type = "sawtooth"; o.frequency.value = 90;
    const g2 = ctx.createGain(); g2.gain.value = 0.02;
    o.connect(g2); g2.connect(ctx.destination);
    n.connect(f); f.connect(g); g.connect(ctx.destination);
    o.start(); n.start();
    creakNode = { o, n, g, g2, f };
  }
  function stopCreak() {
    if (!creakNode) return;
    try { creakNode.o.stop(); creakNode.n.stop(); } catch (e) {}
    creakNode = null;
  }

  function setHoldUI(on, p, label) {
    $("holdBar").style.opacity = on ? "1" : "0";
    $("holdLabel").style.opacity = on ? "1" : "0";
    $("holdFill").style.width = Math.round((p || 0) * 100) + "%";
    if (label) $("holdLabel").textContent = label;
  }

  function applyDoorPose(it) {
    const t = easeOutCubic(Math.min(1, it.progress));
    it.hinge.rotation.y = -t * 1.62;
    if (it.solid) {
      if (t > 0.58) {
        it.solid.w = 0.22;
        it.solid.d = 2.05;
        it.solid.x = -1.08;
        it.solid.z = it.z - 1.05;
      } else {
        it.solid.w = 2.08;
        it.solid.d = 0.35;
        it.solid.x = 0;
        it.solid.z = it.z;
      }
    }
  }

  function updateAtmosphere() {
    const dark = st.door >= 30;
    if (scene && scene.fog) {
      scene.fog.density = dark ? 0.09 : 0.014;
      scene.fog.color.set(dark ? 0x000000 : 0x2a2820);
    }
    if (ambient) {
      ambient.color.set(dark ? 0x223 : 0xc4c2a8);
      ambient.intensity = dark ? 0.07 : 0.72;
    }
    renderer.setClearColor(dark ? 0x000000 : 0x1c1a14);
    document.getElementById("vignette").style.boxShadow = dark
      ? "inset 0 0 140px 50px #000c"
      : "inset 0 0 50px 8px #0004";
  }

  function tryMove(dx, dz) {
    if (hiding) return;
    const rad = 0.32;
    let nx = player.x + dx, nz = player.z + dz;
    if (!collides(nx, player.z, rad)) player.x = nx;
    if (!collides(player.x, nz, rad)) player.z = nz;
    const hw = RW / 2 - 0.45;
    player.x = Math.max(-hw, Math.min(hw, player.x));
    if (st.door >= 10 && player.z < redWallZ + 0.55) kill("红墙", "red");
  }

  function nearestInteractive() {
    let best = null, bd = 9;
    for (const it of interactives) {
      const dx = it.x - player.x, dz = it.z - player.z;
      const dist = Math.hypot(dx, dz);
      if (dist < it.r && dist < bd) { bd = dist; best = it; }
    }
    return best;
  }

  function nearestDoor() {
    let best = null, bd = 9;
    for (const it of interactives) {
      if (it.kind !== "door" || it.open) continue;
      const dist = Math.hypot(it.x - player.x, it.z - player.z);
      if (dist < it.r && dist < bd) { bd = dist; best = it; }
    }
    return best;
  }

  function finishOpenDoor(it, fromNet) {
    if (it.open) return;
    it.open = true;
    it.opening = false;
    it.progress = 1;
    applyDoorPose(it);
    if (it.solid) {
      const idx = solids.indexOf(it.solid);
      if (idx >= 0) solids.splice(idx, 1);
      it.solid = null;
    }
    stopCreak();
    setHoldUI(false, 0);
    sfxDoorCreak();
    sfxDoorLatch();
    if (fromNet) {
      maybeSpawnOnDoor(it.door);
      return;
    }
    advanceDoor(it.door);
    maybeSpawnOnDoor(it.door);
    if (net.connected) netSend({ t: "open", door: it.door });
  }

  function tickDoorHold(dt) {
    const it = nearestDoor();
    if (!it || it.open || hiding || a90Active) {
      stopCreak();
      setHoldUI(false, 0);
      return;
    }
    startCreak();
    it.opening = true;
    it.progress = Math.min(1, it.progress + dt * 2.4);
    applyDoorPose(it);
    if (creakNode) {
      creakNode.g.gain.value = 0.02 + it.progress * 0.05;
      creakNode.f.frequency.value = 320 + it.progress * 220;
    }
    setHoldUI(true, it.progress, "开门");
    if (it.progress >= 1) finishOpenDoor(it);
  }

  function clearHideView() {
    stage.classList.remove("in-locker", "in-table");
    if (hideObj && hideObj.mesh) hideObj.mesh.visible = true;
  }
  function restoreHideSpot() {
    const from = hideFrom;
    hideFrom = null;
    if (!from) { crouch = false; player.y = 1.6; return; }
    player.x = from.x;
    player.z = from.z;
    crouch = from.crouch;
    look.yaw = from.yaw;
    look.pitch = from.pitch;
    player.y = crouch ? 1.05 : 1.6;
  }
  function enterHide(it) {
    if (hiding) return;
    hideFrom = { x: player.x, y: player.y, z: player.z, crouch, yaw: look.yaw, pitch: look.pitch };
    hiding = true; hideObj = it; hideTime = 0;
    it.occupied = true;
    if (it.kind === "locker") {
      const inward = it.x >= 0 ? -1 : 1;
      player.x = it.x + inward * 0.12;
      player.z = it.z;
      player.y = 1.45;
      look.yaw = it.x >= 0 ? -Math.PI / 2 : Math.PI / 2;
      look.pitch = 0.02;
      if (it.mesh) it.mesh.visible = false;
      stage.classList.add("in-locker");
      showHint("藏进储物柜", 800);
      sfxLocker(true);
    } else {
      player.y = 0.36;
      crouch = true;
      look.pitch = 0.18;
      stage.classList.add("in-table");
      showHint("躲进桌下", 800);
      noiseBurst(0.08, 0.06, 140, "lowpass");
    }
  }
  function exitHide() {
    if (!hiding) return;
    hiding = false;
    if (hideObj) hideObj.occupied = false;
    clearHideView();
    hideObj = null;
    restoreHideSpot();
    updateAtmosphere();
    sfxLocker(false);
  }

  function pickup(it) {
    it.taken = true;
    scene.remove(it.mesh);
    if (it.kind === "battery") { st.batteries++; showHint("电池 +1", 900); beep(240, 0.08, "triangle", 0.06); noiseBurst(0.06, 0.05, 700); }
    if (it.kind === "bandage") { st.bandages++; showHint("绷带 +1", 900); beep(210, 0.08, "triangle", 0.05); }
    if (it.kind === "flashlight") { st.hasFlash = true; showHint("拿到手电筒", 1200); sfxFlash(true); }
    if (it.kind === "lighter") { st.hasLighter = true; showHint("打火机 · 短时照明", 1200); beep(380, 0.06, "triangle", 0.05); }
    if (it.kind === "gummy") { st.hasGummy = true; st.useGummy = true; st.useCrank = false; st.useLighter = false; showHint("胶选手电 · 无限电量", 1800); beep(660, 0.16, "sine", 0.08); }
    updateHud();
    if (net.connected) netSend({ t: "loot", kind: "item", x: it.x, z: it.z });
  }

  function interact() {
    if (st.dead || a90Active) return;
    if (hiding) { exitHide(); return; }
    if (nearestDoor()) return;
    for (const it of items3d) {
      if (it.taken) continue;
      if (Math.hypot(it.x - player.x, it.z - player.z) < 1.4) { pickup(it); return; }
    }
    const it = nearestInteractive();
    if (!it) return;
    if (it.kind === "door") return;
    else if (it.kind === "locker" || it.kind === "table") enterHide(it);
    else if (it.kind === "drawer") lootDrawer(it);
    else if (it.kind === "save") useCheckpoint(it);
  }

  function useCheckpoint(it) {
    saveGame(true);
    if (st.hasCrank) return;
    if (st.batteries >= 20) {
      st.batteries -= 20;
      st.hasCrank = true;
      st.useCrank = true;
      st.useGummy = false;
      st.useLighter = false;
      st.crankCharge = 70;
      st.lightOn = true;
      showHint("兑换手摇手电 · 按住 R / 换电 手摇充电", 2600);
      beep(480, 0.12, "triangle", 0.07);
      beep(720, 0.18, "sine", 0.08);
      updateLights();
      updateHud();
    } else {
      showHint("手摇手电需要 20 电池（现有 " + st.batteries + "）", 2000);
    }
  }

  function sfxCrank() {
    noiseBurst(0.07, 0.05, 420);
    beep(90 + Math.random() * 40, 0.06, "square", 0.03);
  }

  function cycleLight() {
    const modes = [];
    if (st.hasFlash) modes.push("flash");
    if (st.hasCrank) modes.push("crank");
    if (st.hasGummy) modes.push("gummy");
    if (st.hasLighter) modes.push("lighter");
    if (!modes.length) return;
    const cur = st.useGummy ? "gummy" : st.useCrank ? "crank" : st.useLighter ? "lighter" : "flash";
    let i = modes.indexOf(cur);
    if (i < 0) i = 0;
    const next = modes[(i + 1) % modes.length];
    st.useGummy = next === "gummy";
    st.useCrank = next === "crank";
    st.useLighter = next === "lighter";
    st.lightOn = true;
    const names = { flash: "手电筒", crank: "手摇手电", gummy: "胶选手电", lighter: "打火机" };
    showHint(names[next], 800);
    sfxFlash(true);
    updateLights();
    updateHud();
  }

  function lootDrawer(it) {
    if (it.looted) { showHint("空的", 700); return; }
    it.looted = true;
    it.mesh.position.z += 0.18;
    const r = rng(it.seed + 99);
    if (r > 0.55) { st.batteries++; showHint("抽屉里有电池", 1000); }
    else if (r > 0.35) { st.bandages++; showHint("抽屉里有绷带", 1000); }
    else if (r > 0.22 && !st.hasLighter) { st.hasLighter = true; showHint("抽屉里有打火机", 1200); }
    else showHint("空抽屉", 800);
    noiseBurst(0.1, 0.07, 260, "lowpass");
    beep(180, 0.1, "triangle", 0.04);
    updateHud();
    if (net.connected) netSend({ t: "loot", kind: "drawer", seed: it.seed });
  }

  function toggleLight() {
    if (!st.hasFlash && !st.hasGummy && !st.hasLighter && !st.hasCrank) return;
    st.lightOn = !st.lightOn;
    $("btnLight").classList.toggle("on", st.lightOn);
    sfxFlash(st.lightOn);
    updateLights();
  }
  function updateLights() {
    const g = st.useGummy && st.hasGummy;
    const c = st.useCrank && st.hasCrank && !g;
    const L = st.useLighter && st.hasLighter && !g && !c;
    flashlight.visible = st.lightOn && !g && !c && !L && st.hasFlash && st.battery > 0;
    gummyLight.visible = st.lightOn && g;
    crankLight.visible = st.lightOn && c && st.crankCharge > 0.5;
    if (c) {
      const p = Math.max(0, Math.min(1, st.crankCharge / 100));
      crankLight.intensity = 0.45 + p * 2.05;
      crankLight.distance = 8 + p * 12;
      crankLight.angle = Math.PI / 8.5 + (1 - p) * 0.04;
    }
    flashlight.intensity = L ? 0.9 : 2.6;
    flashlight.distance = L ? 8 : 22;
    flashlight.angle = L ? Math.PI / 10 : Math.PI / 7.5;
    if (L) flashlight.visible = st.lightOn;
    $("btnLight").classList.toggle("on", st.lightOn);
    $("btnBat").textContent = c ? "手摇" : "换电";
  }
  function reloadBattery() {
    if (st.useCrank && st.hasCrank) return;
    if (st.batteries <= 0 || st.useGummy) return;
    st.batteries--;
    st.battery = Math.min(100, st.battery + 55);
    showHint("更换电池", 800);
    noiseBurst(0.08, 0.08, 500);
    beep(180, 0.1, "triangle", 0.05);
    updateHud();
  }

  function maybeSpawnOnDoor(door) {
    if (net.connected && !net.host) return;
    const d = door == null ? st.door : door | 0;
    const t = roomType(d);
    const hasHide = t === "lockers" || t === "check" || t === "pillars" || t === "cabinets" || t === "tables" || t === "desks";
    if (d >= 60 && hasHide && rng(d * 3 + 17) > 0.62) spawnA60(false, zOf(d) + 8);
    else if (d >= 120 && hasHide && rng(d * 5 + 9) > 0.7) spawnA120(false, zOf(d) + 8);
  }

  function spawnA60(fromNet, atZ) {
    if (entities.some((e) => e.kind === "a60" || e.kind === "a120")) return;
    if (net.connected && !net.host && !fromNet) return;
    const z0 = atZ == null ? player.z : atZ;
    const wind = warnDur();
    showWarn("……", wind * 1000);
    startRumble();
    if (navigator.vibrate) navigator.vibrate([80, 40, 80]);
    noiseBurst(1.1, 0.16, 160, "lowpass");
    const faces = [0, 1, 2, 3].map(texFaceA60);
    const mat = new THREE.MeshBasicMaterial({ map: faces[0], transparent: true });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 2.6), mat);
    mesh.position.set(0, 1.7, z0 - 28);
    mesh.visible = false;
    scene.add(mesh);
    const light = new THREE.PointLight(0xff1a1a, 3.5, 16);
    mesh.add(light);
    entities.push({ kind: "a60", mesh, mat, faces, fi: 0, z: z0 - 28, speed: 28, life: 0, light, wind, wind0: wind });
    if (net.connected && net.host && !fromNet) netSend({ t: "spawn", kind: "a60", z: z0 });
  }

  function spawnA120(fromNet, atZ) {
    if (entities.some((e) => e.kind === "a60" || e.kind === "a120")) return;
    if (net.connected && !net.host && !fromNet) return;
    const z0 = atZ == null ? player.z : atZ;
    const wind = warnDur();
    showWarn("咚  咚  咚", wind * 1000);
    sfxA120Drum();
    const mat = new THREE.MeshBasicMaterial({ map: texFaceA120(), transparent: true });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.2), mat);
    mesh.position.set(0, 1.6, z0 + 36);
    mesh.visible = false;
    scene.add(mesh);
    const light = new THREE.PointLight(0xffffff, 2.2, 12);
    mesh.add(light);
    entities.push({ kind: "a120", mesh, z: z0 + 36, speed: -11, life: 0, passes: 0, light, wind, wind0: wind });
    if (net.connected && net.host && !fromNet) netSend({ t: "spawn", kind: "a120", z: z0 });
  }

  function triggerA90(fromNet) {
    if (a90Active || st.dead || a90Warn > 0) return;
    if (!fromNet && hiding) return;
    if (net.connected && !net.host && !fromNet) return;
    a90Warn0 = warnDur();
    a90Warn = a90Warn0;
    showWarn("……", a90Warn * 1000);
    noiseBurst(0.4, 0.1, 2200);
    if (navigator.vibrate) navigator.vibrate(30);
    if (net.connected && net.host && !fromNet) netSend({ t: "a90", phase: "warn" });
  }
  function beginA90(fromNet) {
    if (a90Active || st.dead) return;
    a90Active = true; a90Timer = 0; a90Warn = 0;
    a90el.style.display = "block";
    drawA90();
    sfxA90();
    if (navigator.vibrate) navigator.vibrate(40);
    if (net.connected && net.host && !fromNet) netSend({ t: "a90", phase: "go" });
  }
  function drawA90() {
    const c = $("a90c"); const vs = viewSize(); c.width = vs; c.height = vs;
    const g = c.getContext("2d");
    g.fillStyle = "#000"; g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = "#111";
    for (let i = 0; i < 400; i++) g.fillRect(Math.random() * c.width, Math.random() * c.height, 2, 2);
    const cx = c.width / 2, cy = c.height / 2;
    g.strokeStyle = "#fff"; g.lineWidth = 3;
    g.beginPath(); g.arc(cx, cy, 90, 0, 7); g.stroke();
    g.beginPath(); g.arc(cx - 30, cy - 20, 8, 0, 7); g.arc(cx + 30, cy - 20, 8, 0, 7); g.fillStyle = "#fff"; g.fill();
    g.beginPath(); g.moveTo(cx - 40, cy + 30); g.lineTo(cx + 40, cy + 30); g.stroke();
    g.font = "12px monospace"; g.fillText("STOP", cx - 16, cy + 80);
  }
  function endA90(moved) {
    a90el.style.display = "none";
    a90Active = false;
    a90Cooldown = 10 + Math.random() * 16;
    if (moved) kill("A-90", "a90");
  }

  function jumpscare(kind) {
    jsel.style.display = "block";
    const c = $("jsc"); const vs = viewSize(); c.width = vs; c.height = vs;
    const g = c.getContext("2d");
    g.fillStyle = "#000"; g.fillRect(0, 0, c.width, c.height);
    if (kind === "a60" || kind === "red") {
      g.fillStyle = "#410000"; g.fillRect(0, 0, c.width, c.height);
      g.fillStyle = "#ff1a1a";
      g.beginPath(); g.ellipse(c.width * 0.35, c.height * 0.38, 40, 70, 0, 0, 7);
      g.ellipse(c.width * 0.65, c.height * 0.4, 50, 40, 0, 0, 7); g.fill();
      g.fillStyle = "#fff";
      g.beginPath(); g.arc(c.width * 0.35, c.height * 0.38, 12, 0, 7); g.arc(c.width * 0.65, c.height * 0.4, 10, 0, 7); g.fill();
      g.strokeStyle = "#ff3030"; g.lineWidth = 8;
      g.beginPath(); g.moveTo(c.width * 0.2, c.height * 0.7); g.quadraticCurveTo(c.width * 0.5, c.height * 0.95, c.width * 0.82, c.height * 0.62); g.stroke();
    } else if (kind === "a120") {
      g.strokeStyle = "#fff"; g.lineWidth = 6;
      g.beginPath(); g.arc(c.width / 2, c.height / 2, 160, 0, 7);
      g.moveTo(c.width / 2 - 80, c.height / 2 - 40); g.lineTo(c.width / 2 - 50, c.height / 2 - 90);
      g.moveTo(c.width / 2 + 80, c.height / 2 - 40); g.lineTo(c.width / 2 + 50, c.height / 2 - 90);
      g.moveTo(c.width / 2 - 70, c.height / 2 + 50); g.quadraticCurveTo(c.width / 2, c.height / 2 + 140, c.width / 2 + 70, c.height / 2 + 50);
      g.stroke();
    } else {
      g.fillStyle = "#fff"; g.font = "bold 48px monospace"; g.textAlign = "center";
      g.fillText("STOP", c.width / 2, c.height / 2);
    }
    sfxKill(kind);
    if (navigator.vibrate) navigator.vibrate([200, 50, 200]);
  }

  function kill(by, kind) {
    if (st.dead) return;
    st.dead = true;
    running = false;
    stopRumble();
    hiding = false;
    clearHideView();
    hideObj = null;
    hideFrom = null;
    staticAmt = 1;
    drawStatic();
    jumpscare(kind || "a60");
    if (net.connected) netSend({ t: "kill", by: by, kind: kind || "a60" });
    const msgs = {
      "A-60": "红色的那张脸从身后冲了过来。下次听到静电，立刻躲进柜子。",
      "A-90": "屏幕上的脸出现时，站住。不要走，不要转头。",
      "A-120": "白色涂鸦会从前方慢慢逼近，可能折返。躲进柜子，等它走完。",
      "红墙": "走过的房间会被抹去。红墙后面什么都没有。不要回头太远。"
    };
    $("deathMsg").textContent = msgs[by] || by;
    $("btnRetry").style.display = net.connected ? "none" : "inline-block";
    setTimeout(() => { jsel.style.display = "none"; death.style.display = "flex"; }, 900);
  }

  function finish() {
    st.won = true; running = false; stopRumble();
    st.hasGummy = true;
    saveGame(false);
    win.style.display = "flex";
  }

  function saveGame(talk) {
    if (net.connected) {
      st.checkpoint = checkDoor(st.door);
      updateHud();
      if (talk) showHint("联机中 · 检查点 " + doorName(st.checkpoint), 1200);
      return;
    }
    const cp = checkDoor(st.door);
    const data = {
      door: cp, checkpoint: cp,
      battery: st.battery, batteries: st.batteries, bandages: st.bandages,
      hasFlash: st.hasFlash, hasGummy: st.hasGummy, hasLighter: st.hasLighter,
      hasCrank: st.hasCrank, crankCharge: st.crankCharge, useCrank: st.useCrank,
      seedBase
    };
    st.checkpoint = cp;

    if (!keepSeed) seedBase = (Math.random() * 1e9) | 0;
    st.hp = 100; st.battery = 80; st.batteries = 2; st.bandages = 0;
    st.hasFlash = true; st.hasGummy = false; st.hasLighter = false; st.hasCrank = false;
    st.useGummy = false; st.useLighter = false; st.useCrank = false; st.crankCharge = 0;
    st.lightOn = true; st.stamina = 100;
    applyRunAt(0);
    if (!net.connected) saveGame(false);
  }
  function startGame(mode) {
    ensureAudio();
    stage.classList.remove("title");
    menu.style.display = "none";
    hideLobby();
    death.style.display = "none";
    win.style.display = "none";
    jsel.style.display = "none";
    a90el.style.display = "none";
    entities.forEach((e) => scene.remove(e.mesh));
    entities = [];
    stopRumble();
    for (const d of [...rooms.keys()]) unloadRoom(d);
    items3d.forEach((it) => scene.remove(it.mesh));
    items3d = []; generated = new Set();
    solids = []; interactives = []; flickerLights = [];
    hiding = false; hideObj = null; hideFrom = null; crouch = false; a90Active = false; a90Warn = 0; a90Warn0 = 0;
    stage.classList.remove("in-locker", "in-table");
    holdUse = false; holdOnce = false; holdShake = false; shakeTick = 0;
    stopCreak(); setHoldUI(false, 0);
    clearStatic();

    if (mode === "continue") {
      const s = loadSave();
      if (s) {
        seedBase = s.seedBase || seedBase;
        st.battery = s.battery; st.batteries = s.batteries; st.bandages = s.bandages;
        st.hasFlash = s.hasFlash; st.hasGummy = s.hasGummy; st.hasLighter = !!s.hasLighter;
        st.hasCrank = !!s.hasCrank; st.crankCharge = s.crankCharge || 0; st.useCrank = !!s.useCrank;
        applyRunAt(s.checkpoint);
      } else startNewRun();
    } else if (mode === "retry") {
      applyRunAt(st.checkpoint);
    } else if (mode === "net") {
      startNewRun(true);
      player.x = netSlotX();
    } else {
      startNewRun();
    }
    st.dead = false; st.won = false; st.lightOn = true; st.stamina = 100;
    a90Cooldown = 8 + Math.random() * 10;
    ensureRooms();
    placeRedWall();
    updateAtmosphere();
    updateHum();
    updateLights();
    updateHud();
    running = true;
    clock.getDelta();
    requestAnimationFrame(loop);
    showHint(mode === "net" ? ("联机 " + net.code + " · 靠近自动开门") : (st.door > 0 ? ("从检查点 " + doorName(st.door) + " 重生") : "打开门。听声音。藏起来。"), 2200);
  }

  function bindControls() {
    addEventListener("keydown", (e) => {
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
      keys[e.code] = true;
      if (e.code === "KeyE") { holdUse = true; if (!holdOnce) { holdOnce = true; interact(); } }
      if (e.code === "KeyF") toggleLight();
      if (e.code === "KeyR") { if (st.useCrank && st.hasCrank) holdShake = true; else reloadBattery(); }
      if (e.code === "KeyG") cycleLight();
      if (e.code === "KeyT" && st.hasLighter) { st.useLighter = !st.useLighter; if (st.useLighter) { st.useGummy = false; st.useCrank = false; } updateLights(); showHint(st.useLighter ? "打火机" : "手电筒", 800); }
      if (e.code === "Digit1" && st.bandages > 0) { st.bandages--; st.hp = 100; showHint("使用绷带", 800); }
      if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
    });
    addEventListener("keyup", (e) => { keys[e.code] = false; if (e.code === "KeyE") { holdUse = false; holdOnce = false; } if (e.code === "KeyR") holdShake = false; });
    canvas.addEventListener("click", () => {
      if (menu.style.display !== "none" || $("lobby").style.display === "flex") return;
      canvas.requestPointerLock && canvas.requestPointerLock();
    });
    document.addEventListener("pointerlockchange", () => { pointerLocked = document.pointerLockElement === canvas; });
    addEventListener("mousemove", (e) => {
      if (!pointerLocked || a90Active) return;
      look.yaw -= e.movementX * 0.0025;
      look.pitch -= e.movementY * 0.0025;
      look.pitch = Math.max(-1.2, Math.min(1.2, look.pitch));
      keys._look = Math.abs(e.movementX) + Math.abs(e.movementY) > 1;
    });

    let lookId = null, lx = 0, ly = 0;
    canvas.addEventListener("touchstart", (e) => {
      for (const t of e.changedTouches) {
        const sr = stage.getBoundingClientRect();
        if (t.clientX > sr.left + sr.width * 0.38) { lookId = t.identifier; lx = t.clientX; ly = t.clientY; }
      }
    }, { passive: true });
    canvas.addEventListener("touchmove", (e) => {
      for (const t of e.changedTouches) {
        if (t.identifier === lookId) {
          const dx = t.clientX - lx, dy = t.clientY - ly;
          lx = t.clientX; ly = t.clientY;
          if (!a90Active) {
            look.yaw -= dx * 0.005;
            look.pitch -= dy * 0.005;
            look.pitch = Math.max(-1.2, Math.min(1.2, look.pitch));
            if (Math.abs(dx) + Math.abs(dy) > 2) keys._look = true;
          }
        }
      }
    }, { passive: true });
    canvas.addEventListener("touchend", (e) => {
      for (const t of e.changedTouches) if (t.identifier === lookId) lookId = null;
    });

    const base = $("joyBase"), knob = $("joyKnob");
    let jid = null;
    function joyAt(x, y) {
      const r = base.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      let dx = x - cx, dy = y - cy;
      const max = r.width * 0.36;
      const m = Math.hypot(dx, dy);
      if (m > max) { dx *= max / m; dy *= max / m; }
      knob.style.left = (28 + dx) + "px";
      knob.style.top = (28 + dy) + "px";
      joy.x = dx / max;
      joy.y = dy / max;
    }
    function joyEnd() { jid = null; joy.x = 0; joy.y = 0; knob.style.left = "28px"; knob.style.top = "28px"; }
    base.addEventListener("touchstart", (e) => { e.preventDefault(); jid = e.changedTouches[0].identifier; joyAt(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }, { passive: false });
    addEventListener("touchmove", (e) => {
      for (const t of e.changedTouches) if (t.identifier === jid) joyAt(t.clientX, t.clientY);
    }, { passive: true });
    addEventListener("touchend", (e) => { for (const t of e.changedTouches) if (t.identifier === jid) joyEnd(); });

    $("btnUse").addEventListener("touchstart", (e) => { e.preventDefault(); holdUse = true; interact(); }, { passive: false });
    $("btnUse").addEventListener("touchend", () => { holdUse = false; });
    $("btnUse").addEventListener("mousedown", (e) => { e.preventDefault(); holdUse = true; interact(); });
    $("btnUse").addEventListener("mouseup", () => { holdUse = false; });
    $("btnUse").addEventListener("mouseleave", () => { holdUse = false; });
    $("btnLight").addEventListener("touchstart", (e) => { e.preventDefault(); toggleLight(); }, { passive: false });
    $("btnLight").addEventListener("mousedown", (e) => { e.preventDefault(); toggleLight(); });
    $("btnBat").addEventListener("touchstart", (e) => { e.preventDefault(); if (st.useCrank && st.hasCrank) holdShake = true; else reloadBattery(); }, { passive: false });
    $("btnBat").addEventListener("touchend", () => { holdShake = false; });
    $("btnBat").addEventListener("mousedown", (e) => { e.preventDefault(); if (st.useCrank && st.hasCrank) holdShake = true; else reloadBattery(); });
    $("btnBat").addEventListener("mouseup", () => { holdShake = false; });
    $("btnBat").addEventListener("mouseleave", () => { holdShake = false; });
    const sp = $("btnSprint");
    const sd = () => { sprintBtn = true; sp.classList.add("on"); };
    const su = () => { sprintBtn = false; sp.classList.remove("on"); };
    sp.addEventListener("touchstart", (e) => { e.preventDefault(); sd(); }, { passive: false });
    sp.addEventListener("touchend", su);
    sp.addEventListener("mousedown", sd);
    addEventListener("mouseup", su);

    addEventListener("resize", resizeView);
  }

  function boot() {
    initThree();
    bindControls();
    const s = loadSave();
    if (s) { $("btnCont").style.display = "inline-block"; $("btnCont").textContent = "继续 " + doorName(s.checkpoint || 0); }
    $("btnNew").onclick = () => { netDisconnect(); startGame("new"); };
    $("btnCont").onclick = () => { netDisconnect(); startGame("continue"); };
    $("btnRetry").onclick = () => startGame("retry");
    $("btnMenu").onclick = () => {
      death.style.display = "none";
      if (net.connected) { netSend({ t: "leave" }); netDisconnect(); }
      showTitle();
    };
    $("btnWin").onclick = () => {
      win.style.display = "none";
      if (net.connected) { netSend({ t: "leave" }); netDisconnect(); }
      showTitle();
    };
    $("btnHost").onclick = () => hostRoom();
    $("btnJoin").onclick = () => joinRoom();
    $("btnNetStart").onclick = () => { if (net.host) netSend({ t: "start", seed: seedBase }); };
    $("btnNetLeave").onclick = () => { netSend({ t: "leave" }); netDisconnect(); showTitle(); };
    $("netCode").addEventListener("keydown", (e) => { if (e.key === "Enter") joinRoom(); });
    try { const n = localStorage.getItem("rooms_name"); if (n) $("netName").value = n; } catch (e) {}
    function renderMenu() {
      requestAnimationFrame(renderMenu);
      if (!running && renderer) renderer.render(scene, camera);
    }
    scene.background = new THREE.Color(0x000000);
    showTitle();
    renderMenu();
  }

  function showTitle() {
    running = false;
    st.dead = false;
    entities.forEach((e) => scene.remove(e.mesh));
    entities = [];
    stopRumble();
    clearStatic();
    for (const d of [...rooms.keys()]) unloadRoom(d);
    items3d.forEach((it) => scene.remove(it.mesh));
    items3d = []; generated = new Set();
    solids = []; interactives = []; flickerLights = [];
    hiding = false; hideObj = null; hideFrom = null;
    a90Active = false; a90Warn = 0; a90Warn0 = 0;
    st.door = 0;
    ensureRooms();
    placeRedWall();
    updateAtmosphere();
    player.x = 0; player.y = 1.55; player.z = 6.2;
    look.yaw = 0; look.pitch = 0.08;
    camera.position.set(player.x, player.y, player.z);
    camera.rotation.set(look.pitch, look.yaw, 0, "YXZ");
    stage.classList.add("title");
    menu.style.display = "flex";
    hideLobby();
    death.style.display = "none";
    win.style.display = "none";
    jsel.style.display = "none";
    a90el.style.display = "none";
    $("btnRetry").style.display = "inline-block";
    if (!net.connected) { net.code = ""; $("netLine").textContent = ""; }
    const s = loadSave();
    if (s) { $("btnCont").style.display = "inline-block"; $("btnCont").textContent = "继续 " + doorName(s.checkpoint || 0); }
  }

  if (typeof THREE === "undefined") {
    document.body.innerHTML = "<p style='color:#fff;padding:20px'>无法加载 Three.js</p>";
  } else boot();
})();
</script>
</body>
</html>
